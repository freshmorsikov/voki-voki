<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1b1738" />
    <meta name="description" content="Бросьте кубик и получите волшебное задание." />
    <title>Воки-воки</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <div class="stars" aria-hidden="true"></div>
      <header class="topbar">
        <a class="brand" href="./" aria-label="Воки-воки — на главную">
          <span class="brand-mark">✦</span>
          <span>Воки-воки</span>
        </a>
        <div class="topbar-actions">
          <button class="new-game-button" id="new-game-button" type="button">Новая игра</button>
        </div>
      </header>

      <table class="scoreboard" id="scoreboard" hidden>
        <caption>Счёт</caption>
        <thead><tr><th scope="col">Команда</th><th scope="col">Очки</th></tr></thead>
        <tbody></tbody>
      </table>

      <section class="dice-screen screen active" id="dice-screen" aria-label="Бросок кубика">
        <div class="turn-card" id="dice-turn" hidden></div>
        <button class="dice-button" id="roll-button" type="button">
          <span class="dice-stage" aria-hidden="true">
            <span class="dice-shadow"></span>
            <span class="dice-lift">

                <span class="dice-corner" style="--sx:-1;--sy:-1;--sz:1;--corner-rotation:matrix3d(-0.707106781,0.707106781,0.000000000,0.000000000,0.408248290,0.408248290,0.816496581,0.000000000,-0.577350269,-0.577350269,0.577350269,0.000000000,0.000000000,0.000000000,0.000000000,1.000000000)"></span>
                <span class="dice-corner-backing" style="--sx:-1;--sy:1;--sz:-1;--corner-rotation:matrix3d(-0.707106781,-0.707106781,0.000000000,0.000000000,0.408248290,-0.408248290,-0.816496581,0.000000000,-0.577350269,0.577350269,-0.577350269,0.000000000,0.000000000,0.000000000,0.000000000,1.000000000)"></span>
                <span class="dice-corner" style="--sx:-1;--sy:1;--sz:-1;--corner-rotation:matrix3d(-0.707106781,-0.707106781,0.000000000,0.000000000,0.408248290,-0.408248290,-0.816496581,0.000000000,-0.577350269,0.577350269,-0.577350269,0.000000000,0.000000000,0.000000000,0.000000000,1.000000000)"></span>
                <span class="dice-corner-backing" style="--sx:-1;--sy:1;--sz:1;--corner-rotation:matrix3d(-0.707106781,-0.707106781,0.000000000,0.000000000,0.408248290,-0.408248290,0.816496581,0.000000000,-0.577350269,0.577350269,0.577350269,0.000000000,0.000000000,0.000000000,0.000000000,1.000000000)"></span>
                <span class="dice-corner" style="--sx:-1;--sy:1;--sz:1;--corner-rotation:matrix3d(-0.707106781,-0.707106781,0.000000000,0.000000000,0.408248290,-0.408248290,0.816496581,0.000000000,-0.577350269,0.577350269,0.577350269,0.000000000,0.000000000,0.000000000,0.000000000,1.000000000)"></span>
                <span class="dice-corner-backing" style="--sx:1;--sy:-1;--sz:-1;--corner-rotation:matrix3d(0.707106781,0.707106781,0.000000000,0.000000000,-0.408248290,0.408248290,-0.816496581,0.000000000,0.577350269,-0.577350269,-0.577350269,0.000000000,0.000000000,0.000000000,0.000000000,1.000000000)"></span>
                <span class="dice-corner" style="--sx:1;--sy:-1;--sz:-1;--corner-rotation:matrix3d(0.707106781,0.707106781,0.000000000,0.000000000,-0.408248290,0.408248290,-0.816496581,0.000000000,0.577350269,-0.577350269,-0.577350269,0.000000000,0.000000000,0.000000000,0.000000000,1.000000000)"></span>
                <span class="dice-corner-backing" style="--sx:1;--sy:-1;--sz:1;--corner-rotation:matrix3d(0.707106781,0.707106781,0.000000000,0.000000000,-0.408248290,0.408248290,0.816496581,0.000000000,0.577350269,-0.577350269,0.577350269,0.000000000,0.000000000,0.000000000,0.000000000,1.000000000)"></span>
                <span class="dice-corner" style="--sx:1;--sy:-1;--sz:1;--corner-rotation:matrix3d(0.707106781,0.707106781,0.000000000,0.000000000,-0.408248290,0.408248290,0.816496581,0.000000000,0.577350269,-0.577350269,0.577350269,0.000000000,0.000000000,0.000000000,0.000000000,1.000000000)"></span>

                <span class="dice-corner-backing" style="--sx:1;--sy:1;--sz:1;--corner-rotation:matrix3d(0.707106781,-0.707106781,0.000000000,0.000000000,-0.408248290,-0.408248290,0.816496581,0.000000000,0.577350269,0.577350269,0.577350269,0.000000000,0.000000000,0.000000000,0.000000000,1.000000000)"></span>
                <span class="dice-corner" style="--sx:1;--sy:1;--sz:1;--corner-rotation:matrix3d(0.707106781,-0.707106781,0.000000000,0.000000000,-0.408248290,-0.408248290,0.816496581,0.000000000,0.577350269,0.577350269,0.577350269,0.000000000,0.000000000,0.000000000,0.000000000,1.000000000)"></span>
                <span class="dice-face face-1"><span class="pip p5"></span></span>
                <span class="dice-face face-2"><span class="pip p3"></span><span class="pip p7"></span></span>
                <span class="dice-face face-3"><span class="pip p3"></span><span class="pip p5"></span><span class="pip p7"></span></span>
                <span class="dice-face face-4"><span class="pip p1"></span><span class="pip p3"></span><span class="pip p7"></span><span class="pip p9"></span></span>
                <span class="dice-face face-5"><span class="pip p1"></span><span class="pip p3"></span><span class="pip p5"></span><span class="pip p7"></span><span class="pip p9"></span></span>
                <span class="dice-face face-6"><span class="pip p1"></span><span class="pip p3"></span><span class="pip p4"></span><span class="pip p6"></span><span class="pip p7"></span><span class="pip p9"></span></span>
              </span>
            </span>
          </span>
          <span class="dice-action">Бросить кубик</span>
        </button>
        <button class="hard-button" id="hard-button" type="button">
          Сложное задание
          <span class="result-die hard-die" data-value="6" aria-hidden="true">
            <span class="result-pip rp1"></span><span class="result-pip rp2"></span><span class="result-pip rp3"></span>
            <span class="result-pip rp4"></span><span class="result-pip rp5"></span><span class="result-pip rp6"></span>
            <span class="result-pip rp7"></span><span class="result-pip rp8"></span><span class="result-pip rp9"></span>
          </span>
        </button>
      </section>

      <section class="task-screen screen" id="task-screen" aria-live="polite" aria-labelledby="task-title">
        <div class="turn-card turn-card-task" id="task-turn" hidden></div>
        <div class="result-die" id="result-die" data-value="1" role="img" aria-label="Результат броска: 1">
          <span class="result-pip rp1"></span><span class="result-pip rp2"></span><span class="result-pip rp3"></span>
          <span class="result-pip rp4"></span><span class="result-pip rp5"></span><span class="result-pip rp6"></span>
          <span class="result-pip rp7"></span><span class="result-pip rp8"></span><span class="result-pip rp9"></span>
        </div>
        <article class="task-card">
          <div class="card-glow" aria-hidden="true"></div>
          <h1 id="task-title" tabindex="-1">Загружаем задание…</h1>
          <p class="task-description" id="task-description"></p>
          <div class="words-block">
            <ul class="words-list" id="words-list"></ul>
          </div>
        </article>
        <div class="answer-actions">
          <button class="answer-button answer-wrong" id="wrong-button" type="button">Ответили неправильно <span>0 очков</span></button>
          <button class="answer-button answer-correct" id="correct-button" type="button">Ответили верно <span id="correct-points">+1 очко</span></button>
          <button class="answer-button answer-correct answer-five" type="button" data-points="5" hidden>Ответили верно <span>+5 очков</span></button>
          <button class="answer-button answer-correct answer-five" type="button" data-points="4" hidden>Ответили верно <span>+4 очка</span></button>
          <button class="answer-button answer-correct answer-five" type="button" data-points="3" hidden>Ответили верно <span>+3 очка</span></button>
          <div class="answer-six-buttons" id="answer-six-buttons" hidden></div>
        </div>
        <button class="reroll-button" id="reroll-button" type="button">Перебросить <span aria-hidden="true">↻</span></button>
      </section>
    </main>
    <p class="visually-hidden" id="announcer" aria-live="assertive"></p>
    <script src="app.js"></script>
  </body>
</html>
