<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#18132e" />
  <meta name="description" content="Выбирайте любимый мир и играйте в Воки-воки." />
  <title>Воки-воки — выбери свой мир</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="home.css" />
</head>
<body>
  <main class="home">
    <div class="stars" aria-hidden="true"></div>
    <section class="hero" aria-label="Выбор тематики">
      <img class="logo" src="images/voki-voki-transparent.png" alt="Воки-воки" />
      <p class="intro">Объясняй, показывай, угадывай.<br />И отправляйся в любимые миры вместе с друзьями.</p>
      <div class="worlds">
        <a class="world world-potter" href="game.html" aria-label="Играть в Гарри Поттера">
          <span class="world-art potter-art" aria-hidden="true"><span class="moon"></span><span class="spark spark-one">✦</span><span class="spark spark-two">✧</span><span class="hat">✦</span></span>
          <span class="world-content"><span class="world-kicker">МАГИЯ ЖДЁТ</span><strong>Гарри Поттер</strong><span class="world-description">Заклинания, тайны и немного волшебства</span><span class="world-action">Играть</span></span>
        </a>
        <a class="world world-thrones" href="game.html" aria-label="Играть в Игру престолов">
          <span class="world-art thrones-art" aria-hidden="true"><span class="moon"></span><span class="spark spark-one">✦</span><span class="spark spark-two">✧</span><span class="crown">♛</span></span>
          <span class="world-content"><span class="world-kicker">ЗИМА БЛИЗКО</span><strong>Игра престолов</strong><span class="world-description">Драконы, великие дома и борьба за трон</span><span class="world-action">Играть</span></span>
        </a>
      </div>
    </section>
  </main>
</body>
</html>
